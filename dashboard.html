<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeFit Owner Analytics</title><style>body{margin:0;background:#090909;color:#fff;font:15px Arial}.wrap{max-width:1000px;margin:auto;padding:24px}.gold{color:#e6b84f}.card{background:#171717;border:1px solid #333;border-radius:12px;padding:18px;margin:14px 0}input,button,select{padding:12px;border-radius:8px;border:1px solid #555;background:#101010;color:#fff}button{background:#e6b84f;color:#111;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#101010;padding:16px;border-radius:10px}.metric b{display:block;font-size:28px}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #333}.muted{color:#aaa}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><h1 class="gold">PRIMEFIT · MARKETING ANALYTICS</h1><section id="login" class="card"><h2>Owner sign in</h2><p class="muted">A secure sign-in link will be sent to the authorised email.</p><input id="email" type="email" value="nprimefit@gmail.com"><button id="send">Send sign-in link</button><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div class="card"><span id="who"></span> <button id="logout">Sign out</button> <select id="range"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="all">All time</option></select><button id="refresh">Refresh</button></div><div class="grid" id="metrics"></div><div class="card"><h2>Campaign performance</h2><div id="campaigns"></div></div><div class="card"><h2>Recent activity</h2><div style="overflow:auto"><table><thead><tr><th>Time</th><th>Campaign</th><th>Event</th><th>Device</th></tr></thead><tbody id="recent"></tbody></table></div></div></section></main>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://zpciaferiufetxstgpkp.supabase.co','sb_publishable_JScnxSk0C_kcd1mOR5v38w_4beolLmU'),$=x=>document.getElementById(x);$('send').onclick=async()=>{if($('email').value.trim().toLowerCase()!=='nprimefit@gmail.com'){$('msg').textContent='Email not authorised';return}const{error}=await sb.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.href}});$('msg').textContent=error?error.message:'Check your email for the secure sign-in link.'};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;sb.auth.onAuthStateChange((e,s)=>{if(s)show(s.user)});const{data:{session}}=await sb.auth.getSession();if(session)show(session.user);function show(u){if(u.email?.toLowerCase()!=='nprimefit@gmail.com'){sb.auth.signOut();$('msg').textContent='Not authorised';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.email;load()}function fmt(n){return Number(n||0).toLocaleString('en-IN')}async function load(){let q=sb.from('marketing_events').select('id,event_name,campaign,visitor_id,device_type,created_at').order('created_at',{ascending:false}).limit(10000),days=$('range').value;if(days!=='all'){let d=new Date();d.setDate(d.getDate()-Number(days));q=q.gte('created_at',d.toISOString())}let{data,error}=await q;if(error){$('metrics').textContent=error.message;return}let rows=data||[],views=rows.filter(x=>x.event_name==='page_view'),uniq=new Set(views.map(x=>x.visitor_id).filter(Boolean)).size;let counts=['page_view','whatsapp','directions','website','call','instagram'];$('metrics').innerHTML=[['Page visits',views.length],['Estimated unique',uniq],['WhatsApp clicks',rows.filter(x=>x.event_name==='whatsapp').length],['Directions clicks',rows.filter(x=>x.event_name==='directions').length]].map(x=>'<div class="metric">'+x[0]+'<b>'+fmt(x[1])+'</b></div>').join('');let camps=['newspaper','gym','hostel','local','direct'];$('campaigns').innerHTML='<table><tr><th>Campaign</th><th>Visits</th><th>Actions</th></tr>'+camps.map(c=>'<tr><td>'+c+'</td><td>'+views.filter(x=>x.campaign===c).length+'</td><td>'+rows.filter(x=>x.campaign===c&&x.event_name!=='page_view').length+'</td></tr>').join('')+'</table>';$('recent').innerHTML=rows.slice(0,30).map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString('en-IN')+'</td><td>'+x.campaign+'</td><td>'+x.event_name+'</td><td>'+(x.device_type||'—')+'</td></tr>').join('')}</script></body></html>
